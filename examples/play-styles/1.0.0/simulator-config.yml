  rate-limit:
    cleanup-interval: 60s
    requests-per-minute: 120
  request-body-limit:
    max-bytes: 1048576
  rules:
    action-round-timer-seconds:
      '3': 180
      '4': 180
      '5': 180
    annihilate-earliest-round: 2
    card-category-weights:
      DISRUPTION: 25
      INFORMATION: 25
      PARADOX: 15
      PROBABILITY_SHIFTER: 35
    card-grade-weights:
      I: 60
      II: 30
      III: 10
    cards-per-deal: 7
    cards-per-hand: 5
    declaration-timer-seconds:
      '3': 120
      '4': 120
      '5': 120
    events-per-era:
      '3': 3
      '4': 4
      '5': 5
    faction-bet-latest-round: 2
    foresight:
      writings-per-era: 1
    hand-deal-forced-types: []
    hand-selection-timer-seconds: 300
    max-cascaded-paradoxes: 3
    max-eras: 5
    max-players: 5
    min-players: 3
    once-era-budgeted-specials:
    - ANNIHILATE
    - SEAL
    - CORRUPT
    - MIMIC
    - REWEAVE
    - REWRITE
    paradox-resolution-timer-seconds: 120
    paradox:
      detonate-contests-stabilize: true
      fate-contradiction: true
    probability:
      amplify-multiplier:
        I: 1.5
        II: 2
        III: 3
      band-low-max: 30
      band-medium-max: 60
      ceiling: 90
      erased-weight-to-written-outcome: true
      floor: 0
      momentum-bonus: 10
      push-shift:
        I: 10
        II: 20
        III: 30
      rally-multiplier: 1.5
      suppress-shift:
        I: -10
        II: -20
        III: -30
      swing-shift:
        I: 15
        II: 30
        III: 45
      thread-shift: 0
    reconnect-grace-period-seconds: 30
    scoring:
      annihilation-requires-consequence: true
      erased-outcome-voids-bets: true
      expose-requires-declared-event: true
      score-deltas:
        ANNIHILATED_OUTCOME: 3
        ANNIHILATION_WASTED: 0
        CHAIN_BROKEN: -3
        CHAIN_COMPLETED: 10
        CHAIN_LINK_ADDED: 2
        CHAIN_LINK_MISSED: -1
        CORRUPTED_OPPONENT_CARD: 1
        DECLARED_OUTCOME_MISSED: -1
        DECLARED_OUTCOME_MISSED_WITH_RALLY: -2
        DECLARED_OUTCOME_WON: 5
        DECLARED_OUTCOME_WON_WITH_RALLY: 6
        EVENT_RESOLVED_AS_WRITTEN: 4
        EVENT_RESOLVED_DIFFERENTLY_THAN_WRITTEN: -2
        EXPOSE_SIGNATURE_REVEALED: 2
        FULFILLMENT_SUCCEEDED: 8
        MIMIC_CONTRIBUTED_TO_WIN: 1
        MIMIC_NEVER_TRACED: 4
        PARADOX_CASCADE_PENALTY: -2
        PARADOX_DETONATED: -1
        PARADOX_STABILIZED: 0
        SECRET_OUTCOME_MISSED: -1
        SECRET_OUTCOME_WON: 4
      written-outcome-shields-annihilation: true
    seal-max-uses-per-game: 2
    stabilization:
      faction-claims: false
      prophet-written-resolutions: 3
      weaver-active-chain-links: 2
    tapestry-absorbs-chain-conflict: false
    victory:
      activist-consecutive-declarations: 3
      activist-consecutive-eras-by-player-count:
        '5': true
      eraser-annihilations: 4
      eraser-annihilations-by-player-count:
        '5': 4
      final-era-objective-discount: 0
      normal-victory: false
      prophet-written-resolutions: 3
      prophet-written-resolutions-by-player-count:
        '5': 3
      revisionist-successful-eras: 3
      revisionist-successful-eras-by-player-count:
        '5': 3
      score-tiebreak: true
      weaver-chain-length: 3
    win-score-threshold: 20
  timers:
    action-round-sweep-interval: 1s
    era-saga-scores-updated-sweep-interval: 1s
    event-resubmit-interval: 30s
    event-resubmit-min-age: 2m
    hand-selection-sweep-interval: 1s
    paradox-resolution-sweep-interval: 1s
    reconnect-sweep-interval: 1s
    scoring-completion-sweep-interval: 1s
notification:
  websocket:
    allowed-origins: ${NOTIFICATION_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:*}
    max-pending-messages: 256
    send-buffer-size: 512KB
    send-time-limit: 10s
